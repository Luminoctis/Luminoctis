<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Luminoctis Home</title>
<link rel="stylesheet" href="home.css">
<!-- l10n-skip Виджеты — каждый в своих файлах, подключаются здесь (стиль — <link>, скрипт — <script type="module">):
     home/wallpaper.css + wallpaper.js → #lumi-wallpaper (обои, эффекты)
     home/clock.css     + clock.js     → #lumi-clock     (часы и дата; заменяет заглушку из home.js)
     home/search.css    + search.js    → #lumi-search    (поиск с подсказками)
     home/shortcuts.css + shortcuts.js → #lumi-shortcuts (ярлыки из папки закладок)
     home/notes.css     + notes.js     → #lumi-notes     (LumiNotes: доски; ниже первого экрана, прокруткой)
     Данные виджетов — через home/store.js (папка «Documents\Luminoctis Home», pref luminoctis.home.dir). -->
<script type="module" src="home.js"></script>
<link rel="stylesheet" href="wallpaper.css">
<script type="module" src="wallpaper.js"></script>
<link rel="stylesheet" href="clock.css">
<script type="module" src="clock.js"></script>
<link rel="stylesheet" href="search.css">
<script type="module" src="search.js"></script>
<link rel="stylesheet" href="shortcuts.css">
<script type="module" src="shortcuts.js"></script>
<link rel="stylesheet" href="notes.css">
<script type="module" src="notes.js"></script>
</head>
<body>
<!-- Вкладка Home (js/lumi-home.uc.js): одна на окно, не видна в полосе вкладок; «L» на рейке или клавиша — открыть/вернуться -->
<div id="lumi-wallpaper"></div>
<main id="lumi-home">
  <div id="lumi-first">
    <section id="lumi-clock" aria-label="Часы" data-lumi-l10n-aria-label>
      <div class="lumi-clock-time"></div>
      <div class="lumi-clock-date"></div>
    </section>
    <section id="lumi-search" aria-label="Поиск" data-lumi-l10n-aria-label></section>
    <section id="lumi-shortcuts" aria-label="Ярлыки" data-lumi-l10n-aria-label></section>
    <button type="button" id="lumi-scroll-down" class="lumi-scroll" title="Заметки" aria-label="К заметкам" data-lumi-l10n-title data-lumi-l10n-aria-label><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <section id="lumi-notes" aria-label="LumiNotes"></section>
  <button type="button" id="lumi-scroll-up" class="lumi-scroll" title="Наверх" aria-label="Наверх" data-lumi-l10n-title data-lumi-l10n-aria-label><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</main>
</body>
</html>
