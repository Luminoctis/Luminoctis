<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Настройки Luminoctis</title>
<link rel="icon" href="chrome://global/skin/icons/settings.svg">
<link rel="stylesheet" href="settings.css">
<script type="module" src="settings.js"></script>
</head>
<body>
<main>
  <h1>Настройки Luminoctis</h1>

  <section>
    <h2>Оформление <span class="soon">скоро</span></h2>
    <div class="row disabled">
      <div class="text"><b>Браузер</b><span>Вкладки, боковая панель и панель адреса</span></div>
      <div class="seg"><button class="on" disabled>Tokyo Night</button><button disabled>Zen Mode</button></div>
    </div>
    <div class="row disabled">
      <div class="text"><b>Сайты</b><span>LumiNet: Zen — прозрачность с блюром, Tokyo Night — тёмная палитра</span></div>
      <div class="seg"><button class="on" disabled>Выкл</button><button disabled>Zen</button><button disabled>Tokyo Night</button></div>
    </div>
  </section>

  <section>
    <h2>Вкладки</h2>
    <label class="row">
      <div class="text"><b>Unload Countdown Time</b>
        <span>Вкладка не в фокусе и ничего не играет — после этого времени Firefox выгружает её, когда памяти не хватает.
        Своего таймера выгрузки в Zen 1.23 нет; новое время действует после перезапуска.</span></div>
      <select id="unload">
        <option value="5">5 минут</option><option value="10">10 минут</option><option value="15">15 минут</option>
        <option value="30">30 минут</option><option value="60">1 час</option><option value="never">Никогда</option>
      </select>
    </label>
    <label class="row">
      <div class="text"><b>Новая вкладка вместо переключения</b><span>Если сайт уже открыт — открывать его заново в новой вкладке, а не переходить на открытую</span></div>
      <input type="checkbox" data-pref="luminoctis.urlbar.always-new-tab">
    </label>
    <label class="row">
      <div class="text"><b>Серые выгруженные вкладки</b><span>Выгруженные из памяти вкладки — чёрно-белые и затемнённые</span></div>
      <input type="checkbox" data-pref="luminoctis.tabs.no-grey-unloaded" data-inverted>
    </label>
  </section>

  <section>
    <h2>Inter Menu <span class="soon">скоро</span></h2>
    <label class="row disabled">
      <div class="text"><b>Открывать Inter Menu по клавише</b><span>Отдельная вкладка на весь экран</span></div>
      <input type="checkbox" checked disabled>
    </label>
    <label class="row disabled">
      <div class="text"><b>Перехватывать клавишу</b><span>Сайт не получит нажатие, даже если оно ему нужно (например, Tab в полях ввода)</span></div>
      <input type="checkbox" checked disabled>
    </label>
    <div class="row disabled">
      <div class="text"><b>Клавиша</b></div>
      <div class="key"><kbd>Tab</kbd><button disabled>Изменить</button></div>
    </div>
  </section>

  <section id="sidebar">
    <h2>Боковая панель</h2>
    <h3>Рабочие пространства</h3>
    <div id="spaces" class="list"></div>

    <h3>Закрепы <span class="hint">— это папка закладок «Luminoctis»</span></h3>
    <div id="pins" class="list"></div>
    <div class="actions">
      <button id="pin-current" class="dashed">+ Текущий сайт</button>
      <input id="pin-search" type="search" placeholder="+ Из закладок: начните вводить название или адрес">
    </div>
    <div id="pin-results" class="list"></div>

    <h3>Вид</h3>
    <label class="row">
      <div class="text"><b>Плееры внизу рейки</b><span>Плитки играющих вкладок</span></div>
      <input type="checkbox" data-pref="luminoctis.rail.hide-players" data-inverted>
    </label>
    <label class="row">
      <div class="text"><b>Подпись «PIN»</b><span>Над закрепами</span></div>
      <input type="checkbox" data-pref="luminoctis.rail.hide-pin-label" data-inverted>
    </label>
  </section>
</main>
</body>
</html>
